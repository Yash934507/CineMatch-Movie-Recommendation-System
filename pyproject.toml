[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cinematch"
version = "1.1.0"
description = "Collaborative-filtering movie recommendation internship project"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2",
  "pandas>=2.2,<3",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
  "pillow>=10,<13",
  "scikit-surprise>=1.1.5,<2",
  "fastapi>=0.162,<1",
  "uvicorn>=0.54,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "scikit-learn>=1.4,<2", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
